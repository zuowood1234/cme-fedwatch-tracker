name: Daily CME FedWatch Update

on:
  # Self-scheduled daily run at 09:50 CST (UTC 01:50).
  # Added so the daily update no longer depends on the Cloudflare dispatch,
  # which stopped firing after 2026-09-10 and broke updates 9/11 onward.
  schedule:
    - cron: "50 1 * * *"
  # Cloudflare can still trigger this if its schedule is restored.
  repository_dispatch:
    types: [cloudflare-fedwatch-update]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system dependencies for headless browser
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xfonts-100dpi xfonts-75dpi xfonts-scalable xfonts-cyrillic

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Run scraper with virtual display
        run: xvfb-run -a python scraper.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-update FedWatch data $(date -u +'%Y-%m-%d')"
            git push
          fi

      - name: Push daily summary via ServerChan
        if: success()
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: |
          if [ -n "$SERVERCHAN_SENDKEY" ]; then
            python serverchan.py ./data
          else
            echo "SERVERCHAN_SENDKEY not configured — skipping push."
          fi
